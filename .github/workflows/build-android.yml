name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: |
          npm install -g cordova
          npm install -g cordova-res

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: cordova platform add android@latest

      - name: Generate app icons (Placeholder)
        run: |
          mkdir -p res/android
          if [ ! -f "res/android/icon.png" ]; then
            python3 -c "
from PIL import Image, ImageDraw, ImageFont
img = Image.new('RGB', (512, 512), color='#4A90E2')
draw = ImageDraw.Draw(img)try:
    font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 60)
except:
    font = ImageFont.load_default()
text = 'Mylo TV'
bbox = draw.textbbox((0, 0), text, font=font)
text_width = bbox[2] - bbox[0]
text_height = bbox[3] - bbox[1]
x = (512 - text_width) / 2
y = (512 - text_height) / 2
draw.text((x, y), text, fill='white', font=font)
img.save('res/android/icon.png')
print('Icon created successfully')
" || echo "Warning: Could not create icon via Python"
          fi

      - name: Build Debug APK
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: cordova build android --debug

      - name: Upload Debug APK Artifact
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: mylo-tv-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Setup Keystore for Release Build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
          echo "KEYSTORE_FILE=release-keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cordova build android --release -- \
            -Pandroid.injected.signing.store.file=$KEYSTORE_FILE \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Align and Sign Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd platforms/android/app/build/outputs/apk/release          UNSIGNED_APK=$(ls *-unsigned.apk 2>/dev/null || ls *.apk | head -1)
          if [ -n "$UNSIGNED_APK" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore $KEYSTORE_FILE \
              -storepass $KEYSTORE_PASSWORD \
              -keypass $KEY_PASSWORD \
              $UNSIGNED_APK $KEY_ALIAS
            
            zipalign -v 4 $UNSIGNED_APK MyloTV-release.apk
          else
            # If no unsigned found, try to align the existing one
            ls -la
            zipalign -v 4 *.apk MyloTV-release.apk || cp *.apk MyloTV-release.apk
          fi

      - name: Upload Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: mylo-tv-release-apk
          path: platforms/android/app/build/outputs/apk/release/MyloTV-release.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: platforms/android/app/build/outputs/apk/release/MyloTV-release.apk
          name: "Mylo TV ${{ github.ref_name }}"
          body: |
            ## Mylo TV Android App
            
            **Version:** ${{ github.ref_name }}
            
            ### Features:
            - 🌍 Global TV channel streaming
            - 🔍 Smart filtering by country
            - 📊 Adjustable channel density
            - 🔄 Automatic fallback sources
            
            ### Installation:
            1. Download the APK file below
            2. Enable "Install from Unknown Sources"
            3. Install and enjoy!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
